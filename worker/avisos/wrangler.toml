# Cloudflare Worker de avisos por Telegram. Ver worker/avisos/README.md.
name = "hm-avisos"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
# Orígenes que pueden subir los contratos (la app en local y en GitHub Pages).
ORIGENES = "http://localhost:3000,https://astrolyricx.github.io"
APP_URL = "https://astrolyricx.github.io/hm-valorizaciones/"

# Todos los días a las 7:00 de Lima (12:00 UTC).
[triggers]
crons = ["0 12 * * *"]

# Contratos subidos por la app y suscriptores. Crear con: npx wrangler kv namespace create AVISOS
[[kv_namespaces]]
binding = "AVISOS"
id = "PENDIENTE"

# Los secretos van con `npx wrangler secret put`, nunca en este archivo:
#   TELEGRAM_TOKEN, TELEGRAM_WEBHOOK_SECRET, INVITACION
