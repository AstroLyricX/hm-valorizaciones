name: deploy

# Publica la app en GitHub Pages: https://<usuario>.github.io/<repositorio>/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Test
        run: npm run test:ci

      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Login con Microsoft: definir en Settings → Secrets and variables → Actions → Variables.
          VITE_MSAL_CLIENT_ID: ${{ vars.VITE_MSAL_CLIENT_ID }}
          VITE_MSAL_DOMINIO: ${{ vars.VITE_MSAL_DOMINIO }}
          VITE_MSAL_AUTHORITY: ${{ vars.VITE_MSAL_AUTHORITY || 'https://login.microsoftonline.com/common' }}
          # Sincronización: sitio de SharePoint de H&M (ver docs/AZURE.md).
          VITE_SHAREPOINT_SITIO: ${{ vars.VITE_SHAREPOINT_SITIO }}
          # Consulta de RUC: dirección del Worker (ver worker/ruc/README.md).
          VITE_RUC_API_URL: ${{ vars.VITE_RUC_API_URL }}
          # Avisos por Telegram: dirección del Worker (ver worker/avisos/README.md).
          VITE_AVISOS_API_URL: ${{ vars.VITE_AVISOS_API_URL }}

      # GitHub Pages no conoce las rutas de la app: al recargar /contratos devuelve 404.html,
      # que es la misma app y abre la ruta pedida.
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
